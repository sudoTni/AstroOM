[package]
name = "astroom"
version = "0.1342.0"
edition = "2021"
description = "Indeed job acquisition, filtering, evaluation, and materials-generation pipeline"
license = "MIT"
authors = ["AstroOM Contributors"]
repository = "https://github.com/sudoTni/AstroOM"

[[bin]]
name = "astroom"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "string"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "stream", "gzip", "default-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
regex = "1"
scraper = "0.19"
libc = "0.2"
indexmap = { version = "2", features = ["serde"] }
gif = "0.14"
ab_glyph = "0.2"

# Win32 console APIs for `x86_64-pc-windows-gnu`: terminal geometry, TTY
# detection, and ENABLE_VIRTUAL_TERMINAL_PROCESSING. Not needed on Unix, where
# the equivalents come from libc.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
tempfile = "3"
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
opt-level = 2
