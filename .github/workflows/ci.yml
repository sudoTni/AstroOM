name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

      - name: Release build
        run: cargo build --release

      - name: Smoke test
        run: ./target/release/astroom --help

  windows-gnu:
    name: Windows (x86_64-pc-windows-gnu)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # MinGW-w64 provides the C compiler that the bundled SQLite build needs
      # and the linker rustc selects for this target. The Windows runners
      # already ship both on PATH.
      - name: Report toolchain
        run: |
          rustc --version
          rustup target list --installed
          where gcc || true

      - name: Clippy
        run: cargo clippy --all-targets --target x86_64-pc-windows-gnu -- -D warnings

      # The POSIX-only integration suites (bash launcher, shell rclone/ping
      # shims, POSIX signal delivery) are `#![cfg(unix)]`; everything else runs.
      - name: Test
        run: cargo test --target x86_64-pc-windows-gnu

      - name: Release build
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Smoke test
        run: ./target/x86_64-pc-windows-gnu/release/astroom.exe --help
